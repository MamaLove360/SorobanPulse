[package]
name = "soroban-pulse"
version = "1.0.0"
edition = "2021"
authors = ["SorobanPulse Team"]
description = "Real-time event streaming and observability platform for Soroban/Stellar blockchain"
license = "MIT"
repository = "https://github.com/Soroban-Pulse/SorobanPulse"

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros"] }
diesel = { version = "2.1", features = ["postgres", "uuid", "chrono", "serde_json"], optional = true }

# Cryptography - Classical
ed25519-dalek = "2.1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
aes-gcm = "0.10"

# Cryptography - Post-Quantum (optional feature)
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-kyber = { version = "0.8", optional = true }
pqcrypto-falcon = { version = "0.3", optional = true }
pqcrypto-sphincsplus = { version = "0.7", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

# Time and dates
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.14"
opentelemetry-jaeger = { version = "0.20", optional = true }

# Metrics
prometheus = "0.13"
metrics = "0.21"

# Configuration
config = "0.13"
dotenv = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
uuid = { version = "1.6", features = ["serde", "v4"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# GraphQL
async-graphql = "7.0"
async-graphql-actix-web = "7.0"

# WebSocket
tokio-tungstenite = "0.21"

# Utilities
bytes = "1.5"
base64 = "0.21"
hex = "0.4"
stellar-xdr = { version = "22", features = ["curr", "serde", "base64"] }
regex = "1"
blake3 = "1"
toml = "0.8"
secrecy = "0.5"
rand = "0.8"

# Stellar XDR (ScVal rendering, ledger meta / contract spec decoding) and
# zstd for Galexie ledger files (issues #1252-#1254). 26.x is the newest
# line that still ships the `curr` module the codebase imports.
stellar-xdr = { version = "26.0.1", default-features = false, features = ["std", "curr", "base64", "serde"] }
zstd = "0.13"

# HTTP middleware / static files (the `fs` feature is enabled by `dashboard`)
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full", "metrics", "request-id", "limit"] }

# Service mesh integration
tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }

# Messaging integrations (optional, enabled per-deployment)
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
google-cloud-pubsub = { version = "0.33", optional = true }
google-cloud-googleapis = { version = "0.16", optional = true }
url = { version = "2.5" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
mockall = "0.12"
wiremock = "0.6"
insta = "1"

[[bin]]
name = "gen_env_docs"
path = "src/bin/gen_env_docs.rs"

[[bin]]
name = "gen_postman"
path = "src/bin/gen_postman.rs"
[features]
default = ["classical-crypto", "dashboard"]

# Issue #1112: serve the built web dashboard at /ui (runtime opt-in: SERVE_DASHBOARD=true).
# Build with --no-default-features --features classical-crypto to drop it.
dashboard = ["tower-http/fs"]

# Cryptography features
classical-crypto = []
quantum-crypto = [
    "pqcrypto-dilithium",
    "pqcrypto-kyber",
    "pqcrypto-falcon",
    "pqcrypto-sphincsplus",
    "pqcrypto-traits"
]
hybrid-crypto = ["classical-crypto", "quantum-crypto"]

# Service mesh features
istio = ["tonic", "prost"]
linkerd = ["tonic", "prost"]

# Observability features
full-observability = ["tracing-opentelemetry", "opentelemetry-jaeger"]

# Messaging integrations
kafka = ["dep:rdkafka"]
sqs = []
pubsub = ["dep:google-cloud-pubsub", "dep:google-cloud-googleapis"]

# Chaos testing (gates tests/chaos_tests.rs advisory-lock failover tests)
chaos = []

[lints.clippy]
# Lint policy — replaces the crate-level #![deny]/#![allow] that used to live
# in src/main.rs. Keeping it here makes the configuration visible and applies
# consistently to both the library and binary targets.
all = "deny"
pedantic = "deny"
# AppError, AppState, etc. — repeating the module name is idiomatic in Rust.
module_name_repetitions = "allow"
# Internal service; these are not public library APIs.
missing_errors_doc = "allow"
# Panics only occur on misconfiguration at startup.
missing_panics_doc = "allow"
# Used sparingly in test modules only.
wildcard_imports = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[lib]
name = "soroban_pulse"
path = "src/lib.rs"

[[bin]]
name = "soroban-pulse"
path = "src/main.rs"
