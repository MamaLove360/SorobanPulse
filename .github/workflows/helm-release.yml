name: Helm Chart Release

# Publishes the Helm chart in helm/soroban-pulse to GitHub Pages using
# helm/chart-releaser-action. The packaged chart and the Helm repository
# index (index.yaml) are committed to the `gh-pages` branch, which must be
# configured in the repository settings (Settings > Pages) to serve from
# the `gh-pages` branch (root). Once enabled, operators can run:
#   helm repo add soroban-pulse https://<org>.github.io/SorobanPulse
#
# The chart version is rewritten to match the pushed application version
# tag (e.g. v1.2.3 -> version: 1.2.3) so the chart version always matches
# the application release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Sync chart version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting chart version to ${VERSION}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" helm/soroban-pulse/Chart.yaml
          grep -E '^version:' helm/soroban-pulse/Chart.yaml

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          pages_branch: gh-pages
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"