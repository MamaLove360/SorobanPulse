name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      TF_WORKSPACE:
        description: 'Terraform workspace (environment) to apply'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_WORKSPACE: ${{ github.event.inputs.TF_WORKSPACE || 'staging' }}

jobs:
  apply:
    name: Terraform Apply (${{ github.event.inputs.TF_WORKSPACE || 'staging' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.7.5' }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Workspace Select
        run: terraform workspace select "$TF_WORKSPACE" || terraform workspace new "$TF_WORKSPACE"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="environments/${TF_WORKSPACE}/terraform.tfvars"