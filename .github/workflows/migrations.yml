name: Migrations

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "scripts/migration-roundtrip.sh"
      - "scripts/check-migrations.sh"
      - ".github/workflows/migrations.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "migrations/**"
      - "scripts/migration-roundtrip.sh"
      - "scripts/check-migrations.sh"
      - ".github/workflows/migrations.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Migration Round Trip
    runs-on: ubuntu-latest
    services:
      # Keep the major version in step with the runner's pg_dump client.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: pg_dump --version
      - name: Check migration pairs
        run: bash scripts/check-migrations.sh
      - name: Run migration round trip
        run: bash scripts/migration-roundtrip.sh migrations