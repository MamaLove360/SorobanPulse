name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Nightly run covers the beta toolchain and full Postgres matrix that PRs skip.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions — jobs that need extra permissions declare them locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost/soroban_pulse_test

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk:
              - "sdk/**"
              - "openapi.json"
              - "openapitools.json"
              - "Makefile"
            web:
              - "dashboard/**"
            extension:
              - "vscode-extension/**"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "benches/**", "fuzz/**", "migrations/**"]'), github.event.pull_request.changed_files)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "deny.toml"]'), github.event.pull_request.changed_files)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Single invocation so advisories, bans, licenses and sources are all
      # enforced against the repo's deny.toml (GPL/AGPL denied, unmaintained
      # and vulnerability advisories denied).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all
          arguments: --all-features --config deny.toml

  check-migrations:
    name: Check Migrations
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["migrations/**", "scripts/check-migrations.sh"]'), github.event.pull_request.changed_files)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check-migrations.sh

  migration-roundtrip:
    name: Migration Round-Trip (up + down)
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["migrations/**", "scripts/migration-roundtrip.sh"]'), github.event.pull_request.changed_files)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - name: Run migration round-trip
        run: bash scripts/migration-roundtrip.sh migrations
=======

  validate-sdk:
    name: Validate SDKs
    runs-on: ubuntu-latest
    needs: changes
    # openapi.json drift from the code is caught by the openapi job, so SDK
    # drift can only come from the spec, the generator config or sdk/ itself.
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: make generate-sdk
      - name: Check for diffs
        run: |
          if [ -n "$(git status --porcelain sdk/)" ]; then
            echo "SDKs are out of date. Please run 'make generate-sdk' and commit the changes."
            git status --porcelain sdk/
            exit 1
          fi

  web:
    name: Dashboard Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm test

  extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "benches/**"]'), github.event.pull_request.changed_files)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Build with the committed .sqlx cache so query macros are verified without a live DB.
      - run: SQLX_OFFLINE=true cargo clippy -- -D warnings

  build-tests:
    name: Build Tests (cargo-nextest)
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "migrations/**", ".sqlx/**"]'), github.event.pull_request.changed_files)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stable-nextest
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - uses: taiki-e/install-action@nextest
      - name: Run sqlx prepare check
        run: cargo sqlx prepare --check
      - name: Build test archive
        run: cargo nextest archive --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  sqlx-prepare-check:
    name: sqlx prepare --check
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "migrations/**", ".sqlx/**"]'), github.event.pull_request.changed_files)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stable-nextest
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest archive --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  features:
    name: Check each feature (cargo-hack)
    # Default-feature jobs never compile code behind optional features
    # (quantum-crypto, istio, linkerd, full-observability, kafka, sqs, pubsub).
    # `--each-feature` checks every feature on its own plus --no-default-features.
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "Cargo.*"]'), github.event.pull_request.changed_files)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,sqlx-cli
      # cmake builds librdkafka for the `kafka` feature (rdkafka `cmake-build`).
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev cmake
      # sqlx `query!` macros are checked against the live schema at compile time.
      - run: sqlx migrate run
      # 1. Check every feature in isolation (catches missing cfg guards).
      - run: cargo hack check --each-feature --no-dev-deps
      # 2. Build each feature explicitly so linker errors (not caught by `check`)
      #    are also surfaced.  These mirror the combinations described in
      #    docs/features.md.
      - name: Build – default features
        run: cargo build --features "dashboard,classical-crypto"
      - name: Build – quantum-crypto
        run: cargo build --no-default-features --features "quantum-crypto"
      - name: Build – hybrid-crypto
        run: cargo build --no-default-features --features "hybrid-crypto"
      - name: Build – istio
        run: cargo build --no-default-features --features "classical-crypto,istio"
      - name: Build – linkerd
        run: cargo build --no-default-features --features "classical-crypto,linkerd"
      - name: Build – full-observability
        run: cargo build --no-default-features --features "classical-crypto,full-observability"
      - name: Build – kafka
        run: cargo build --no-default-features --features "classical-crypto,kafka"
      - name: Build – sqs
        run: cargo build --no-default-features --features "classical-crypto,sqs"
      - name: Build – pubsub
        run: cargo build --no-default-features --features "classical-crypto,pubsub"
      - name: Build – kafka + sqs fan-out combination
        run: cargo build --no-default-features --features "classical-crypto,kafka,sqs"

  test:
    name: Test (rust stable, pg ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: build-tests
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "migrations/**"]'), github.event.pull_request.changed_files)
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # PRs run a single Postgres version; main and nightly run the full matrix.
        postgres: ${{ fromJSON(github.event_name == 'pull_request' && '["16"]' || '["15", "16"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --profile ci
        env:
          # Property-based tests for the subscription filter engine run 50k cases.
          PROPTEST_CASES: 50000
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Test report (rust stable, pg ${{ matrix.postgres }})
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  test-beta:
    name: Test (rust beta, pg ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
        with:
          key: beta-pg${{ matrix.postgres }}
      - uses: actions/cache@v4
        with:
          path: .sqlx
          key: ${{ runner.os }}-sqlx-${{ hashFiles('.sqlx/**') }}
          restore-keys: ${{ runner.os }}-sqlx-
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci
        env:
          PROPTEST_CASES: 50000
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Test report (rust beta, pg ${{ matrix.postgres }})

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*"]'), github.event.pull_request.changed_files)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          tool: cargo-llvm-cov,nextest
      - run: sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - name: Run coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - name: Write coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14
          if-no-files-found: ignore

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: build-tests
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --profile ci -E 'binary(pact_contract_tests)'
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Contract test report
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload contract tests report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-tests-report
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  suite-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-tests
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Integration Tests
            binary: integration_tests
          - name: Admin Endpoint Tests
            binary: admin_tests
          - name: Resilience Tests
            binary: resilience
          - name: Chaos Engineering Tests
            binary: chaos_tests
          - name: Chaos Engineering Tests (chaos feature)
            binary: chaos_tests
            features: chaos
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Run ${{ matrix.name }}
        if: matrix.features == ''
        run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --profile ci -E 'binary(${{ matrix.binary }})'
      - name: Run ${{ matrix.name }}
        if: matrix.features != ''
        run: cargo test --features ${{ matrix.features }} --test ${{ matrix.binary }}
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: ${{ matrix.name }} report
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  multi-tenant-rls:
    # Issue #1344: run the multi-tenant isolation suite, including the
    # row-level security tests, against a real PostgreSQL instance. The
    # `postgres` service user is a superuser, which the RLS tests need to
    # create throwaway non-superuser application roles.
    name: Multi-Tenant RLS Isolation (pg ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: build-tests
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "tests/**", "Cargo.*", "migrations/**"]'), github.event.pull_request.changed_files)
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Run multi-tenant isolation tests
        run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --profile ci -E 'binary(multi_tenant_isolation_tests)'
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Multi-Tenant RLS Isolation report (pg ${{ matrix.postgres }})
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  bench:
    name: Bench (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["src/**", "benches/**", "Cargo.*"]'), github.event.pull_request.changed_files)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo bench

  mutants:
    name: Mutation Testing (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          - module: src/models.rs
            description: "Data models"
          - module: src/indexer.rs
            description: "Event indexer"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install cargo-mutants
      - name: Run mutation tests for ${{ matrix.description }}
        run: cargo mutants -m ${{ matrix.module }} --shuffle -j 4 || true
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.module }}
          path: target/mutants/
          retention-days: 7
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run fuzz_validate_contract_id -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_validate_tx_hash -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_pagination_params -- -max_total_time=60
        working-directory: fuzz
      - name: Upload fuzz corpus artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
          retention-days: 30

  check-env-docs:
    name: Check Env Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Verify docs/configuration.md is in sync with src/config.rs
        run: cargo run --bin gen_env_docs -- --check

  check-mdbook:
    name: Check mdBook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mdbook-admonish
        run: |
          curl -sSL https://github.com/tommilligan/mdbook-admonish/releases/download/v1.18.0/mdbook-admonish-v1.18.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory ~/.local/bin
      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.13.0/mdbook-mermaid-v0.13.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory ~/.local/bin
      - name: Build mdBook (must succeed without warnings)
        run: mdbook build 2>&1 | tee /tmp/mdbook-build.log; grep -i "warning\|error" /tmp/mdbook-build.log && exit 1 || true

  build:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3
      - run: cargo build --release

  docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: soroban-pulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enforce image size limit (80 MB)
        run: |
          size=$(docker image inspect --format='{{.Size}}' soroban-pulse:ci)
          limit=83886080
          echo "Image size: ${size} bytes (limit: ${limit} bytes)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Docker image is $((size / 1024 / 1024)) MB, exceeding the 80 MB limit"
            exit 1
          fi
    # Actual publish (tagging, scanning, SBOM) happens in docker-publish.yml
    # on push to main / version tags — kept separate so PR feedback here stays fast.

  network-policy:
    name: NetworkPolicy (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1
        with:
          cluster_name: soroban-pulse
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml || kubectl create namespace soroban-pulse
          kubectl apply -f k8s/network-policy.yaml
      - name: Verify ingress is denied from another namespace
        run: |
          kubectl create namespace attacker
          kubectl run attacker --image=busybox:1.36 --restart=Never -n attacker -- sleep 3600
          kubectl wait --for=condition=Ready pod/attacker -n attacker --timeout=120s
          # The SorobanPulse pod is not running in this smoke test, so assert the
          # policy object exists and selects the app pods.
          kubectl get networkpolicy -n soroban-pulse -o yaml
          kubectl get networkpolicy -n soroban-pulse -o jsonpath='{.items[*].spec.podSelector}' | grep -q . 
      - name: Verify egress rules (DB 5432, RPC 443, DNS 53)
        run: |
          kubectl get networkpolicy -n soroban-pulse -o jsonpath='{.items[*].spec.egress}' | grep -q 5432
          kubectl get networkpolicy -n soroban-pulse -o jsonpath='{.items[*].spec.egress}' | grep -q 443
          kubectl get networkpolicy -n soroban-pulse -o jsonpath='{.items[*].spec.egress}' | grep -q 53

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.14.0"
      - name: Lint Helm chart
        run: helm lint helm/soroban-pulse
      - name: Render template (default values)
        run: helm template soroban-pulse helm/soroban-pulse | grep -v "DATABASE_URL\|API_KEY\|SMTP_PASSWORD"
      - name: Render template (existingSecret)
        run: helm template soroban-pulse helm/soroban-pulse --set existingSecret=my-secret

  check-api-types:
    name: Dashboard API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      # Install only prod+dev deps needed for code generation (no Rust required)
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      # Regenerate schema.d.ts and fail if it differs from the committed copy
      - name: Check schema.d.ts is up to date
        run: node scripts/check-api-up-to-date.mjs
        working-directory: web
      # TypeScript compile-check so a drift in openapi.json → TS error surfaces here
      - name: Typecheck dashboard
        run: npm run typecheck
        working-directory: web

  openapi:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: sudo apt-get install -y pkg-config libssl-dev
      - name: Generate OpenAPI spec
        run: cargo run --bin gen_openapi > /tmp/openapi-generated.json
      - name: Check openapi.json is up to date
        run: |
          if ! diff -q openapi.json /tmp/openapi-generated.json > /dev/null 2>&1; then
            echo "OpenAPI spec is out of date — run make gen-openapi and commit the result"
            diff openapi.json /tmp/openapi-generated.json
            exit 1
          fi
      - name: Copy spec to docs for Swagger UI
        run: cp openapi.json docs/openapi.json
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.11.1
      - name: Validate OpenAPI spec
        run: spectral lint openapi.json --ruleset https://unpkg.com/@stoplight/spectral-openapi/dist/ruleset.js

  config-docs:
    name: Configuration Reference Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: sudo apt-get install -y pkg-config libssl-dev
      # Fails when docs/configuration.md or .env.example are stale, or when
      # src/config.rs reads a variable missing from src/config/reference.rs.
      - name: Check generated configuration docs
        run: cargo run --bin gen_config_docs -- --check

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(fromJSON('["terraform/**"]'), github.event.pull_request.changed_files)
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (backend=false)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: TFLint
        run: tflint --init && tflint --recursive

  # Mandatory check job that always runs to keep branch protection happy
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - deny
      - check-migrations
      - migration-roundtrip
      - validate-sdk
      - web
      - extension
      - clippy
      - build-tests
      - sqlx-prepare-check
      - features
      - test
      - test-beta
      - coverage
      - contract-tests
      - suite-tests
      - multi-tenant-rls
      - bench
      - mutants
      - fuzz
      - build
      - docker
      - network-policy
      - helm-lint
      - check-api-types
      - openapi
      - config-docs
      - terraform-validate
    steps:
      - name: Check all required jobs
        run: |
          # Check if any required job failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          
          # Check if any required job was cancelled
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled"
            exit 1
          fi
          
          echo "All required jobs passed or were skipped"

