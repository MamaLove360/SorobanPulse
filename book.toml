[book]
title = "SorobanPulse Documentation"
description = "Lightweight Rust service that indexes Soroban smart contract events and exposes them via REST API, SSE, and webhooks."
authors = ["Soroban-Pulse contributors"]
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/SorobanPulse/"
git-repository-url = "https://github.com/Soroban-Pulse/SorobanPulse"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Soroban-Pulse/SorobanPulse/edit/main/{path}"
no-section-label = false
additional-css = []
additional-js = []
cname = ""

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2"
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
after = ["links"]
