groups:
  - name: soroban_pulse
    rules:
      - alert: IndexerLagHigh
        expr: soroban_pulse_indexer_lag_ledgers > 100
        for: 5m
        labels:
          severity: warning
          component: indexer
        annotations:
          summary: "Soroban Pulse indexer is falling behind"
          description: "Indexer lag is {{ $value }} ledgers (threshold: 100). The indexer may be experiencing RPC errors or database slowness. Check logs with: kubectl logs -l app=soroban-pulse | grep 'Indexer error'"
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/indexer-lag.md"

      - alert: IndexerLagCritical
        expr: soroban_pulse_indexer_lag_ledgers > 500
        for: 10m
        labels:
          severity: critical
          component: indexer
        annotations:
          summary: "Soroban Pulse indexer lag is critical"
          description: "Indexer lag is {{ $value }} ledgers (threshold: 500). Immediate investigation required. Check RPC endpoint health and database performance."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/indexer-lag.md"

      - alert: IndexerStall
        expr: time() - soroban_pulse_indexer_last_poll_timestamp > 120
        for: 0m
        labels:
          severity: critical
          component: indexer
        annotations:
          summary: "Soroban Pulse indexer has stalled"
          description: "No successful indexer poll in {{ $value | humanizeDuration }}. The indexer may have lost the advisory lock or crashed. Check replica health and restart if necessary."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/indexer-lag.md"

      - alert: HighRPCErrorRate
        expr: |
          rate(soroban_pulse_rpc_errors_total[5m])
          /
          (rate(soroban_pulse_rpc_errors_total[5m]) + rate(soroban_pulse_events_indexed_total[5m]) + 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          component: indexer
        annotations:
          summary: "Soroban Pulse RPC error rate is above 5%"
          description: "More than 5% of RPC calls are failing over the last 5 minutes (current rate: {{ $value | humanizePercentage }}). Check RPC endpoint connectivity and consider switching to a backup RPC node."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/rpc-errors.md"

      - alert: DBPoolExhaustion
        expr: soroban_pulse_db_pool_size >= soroban_pulse_db_pool_max
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Soroban Pulse database connection pool is exhausted"
          description: "The database connection pool has been at maximum capacity for more than 1 minute (pool_size={{ $value }}). New requests may be queued or rejected. Consider increasing DB_MAX_CONNECTIONS or scaling the service."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/db-pool-exhaustion.md"

      - alert: HighHTTPErrorRate
        expr: |
          rate(soroban_pulse_http_request_duration_seconds_count{status=~"5.."}[5m])
          /
          rate(soroban_pulse_http_request_duration_seconds_count[5m])
          > 0.01
        for: 5m
        labels:
          severity: critical
          component: http
        annotations:
          summary: "Soroban Pulse HTTP 5xx error rate exceeds 1%"
          description: "More than 1% of HTTP requests are returning 5xx errors over the last 5 minutes (current rate: {{ $value | humanizePercentage }}). Check application logs for errors and database connectivity."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/indexer-lag.md"

      - alert: P99LatencySLOBreach
        expr: histogram_quantile(0.99, rate(soroban_pulse_http_request_duration_seconds_bucket[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
          component: http
        annotations:
          summary: "Soroban Pulse p99 latency exceeds 200ms SLO"
          description: "p99 request latency is {{ $value | humanizeDuration }} (SLO: 200ms). Consider scaling horizontally, adding database indexes, or investigating slow queries."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/db-pool-exhaustion.md"

      - alert: IndexerRPCErrors
        expr: rate(soroban_pulse_rpc_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: indexer
        annotations:
          summary: "Soroban Pulse RPC errors are elevated"
          description: "RPC error rate is {{ $value }} errors/sec. Check RPC endpoint connectivity and review logs for specific error messages."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/rpc-errors.md"

      - alert: IndexerNoEventsIndexed
        expr: increase(soroban_pulse_events_indexed_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
          component: indexer
        annotations:
          summary: "Soroban Pulse indexer is not indexing events"
          description: "No events indexed in the last 10 minutes. This may be expected during low-activity periods on the network, but could also indicate an indexer stall. Verify network activity and check indexer logs."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/indexer-lag.md"

      # #1327: RPC retention gap detection — fires when the indexed ledger sequence
      # jumps by more than 17,000 in a single 5-minute window. A jump this large
      # means the RPC node has rolled past its retention window and the indexer
      # skipped ahead without indexing the missed events.
      # 17,000 ledgers ≈ ~23.6 h at a 5-second ledger close time, just below the
      # 17,280-ledger (~24 h) default retention window.
      - alert: LedgerSequenceDiscontinuity
        expr: increase(soroban_pulse_indexer_current_ledger[5m]) > 17000
        for: 0m
        labels:
          severity: critical
          component: indexer
        annotations:
          summary: "Soroban Pulse indexer skipped a large ledger range — possible RPC retention gap"
          description: >-
            The indexed ledger sequence increased by {{ $value | humanize }} in a single 5-minute
            window. A jump larger than ~17,000 indicates the RPC node has rolled past its retention
            window and the indexer advanced past a gap without indexing the missing events.
            Follow the RPC retention gap runbook to determine whether to replay from Galexie or
            accept the gap.
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/rpc-retention-gap.md"

      - alert: HTTPRequestLatencyHigh
        expr: histogram_quantile(0.95, rate(soroban_pulse_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "Soroban Pulse HTTP p95 request latency is high"
          description: "p95 request latency is {{ $value | humanizeDuration }}. Consider scaling or investigating database performance."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/db-pool-exhaustion.md"

      - alert: PodMemoryNearLimit
        expr: soroban_pulse_process_memory_bytes / (512 * 1024 * 1024) > 0.9
        for: 5m
        labels:
          severity: warning
          component: resource
        annotations:
          summary: "Soroban Pulse pod memory is approaching the 512Mi limit"
          description: "Process memory is {{ $value | humanizeBytes }} ({{ $value | humanizePercentage }} of the 512Mi limit). OOM kill risk if usage continues to grow. Consider increasing the memory limit or investigating leaks."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/sse-connections.md"
      - alert: UnusedIndexesDetected
        expr: soroban_pulse_unused_indexes_total > 0
        for: 24h
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Soroban Pulse has unused database indexes"
          description: "{{ $value }} index(es) have not been scanned since the last pg_stat_user_indexes reset. Unused indexes waste storage and slow writes. Review with: SELECT indexname, tablename FROM pg_stat_user_indexes WHERE schemaname = 'public' AND idx_scan = 0;"
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/db-pool-exhaustion.md"

      - alert: MatviewRefreshTimeout
        expr: increase(soroban_pulse_matview_refresh_timeout_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Materialized view refresh hit lock timeout"
          description: "A materialized view refresh was skipped due to a lock timeout in the last hour. Check for long-running queries blocking the view lock."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/db-pool-exhaustion.md"

      # #513: Notification delivery SLA alerts
      - alert: NotificationDeliverySLABreach
        expr: |
          histogram_quantile(0.95,
            rate(soroban_pulse_notification_delivery_latency_seconds_bucket[5m])
          ) > 30
        for: 2m
        labels:
          severity: critical
          component: notifications
        annotations:
          summary: "Notification delivery p95 latency exceeds 30s SLA"
          description: "The p95 notification delivery latency for channel {{ $labels.channel }} is {{ $value | humanizeDuration }}, which exceeds the 30s SLA threshold. Check the notification pipeline for backlog or downstream failures."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/notifications.md"

      - alert: NotificationDeliveryLatencyHigh
        expr: |
          histogram_quantile(0.99,
            rate(soroban_pulse_notification_delivery_latency_seconds_bucket[5m])
          ) > 60
        for: 5m
        labels:
          severity: warning
          component: notifications
        annotations:
          summary: "Notification delivery p99 latency exceeds 60s"
          description: "The p99 notification delivery latency for channel {{ $labels.channel }} is {{ $value | humanizeDuration }}. Investigate notification queue depth and downstream webhook/email endpoint health."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/notifications.md"

      # #1328: Notification delivery success rate alert
      - alert: NotificationDeliverySuccessRateLow
        expr: |
          (
            sum(rate(soroban_pulse_notification_delivery_success_total[5m]))
            /
            (
              sum(rate(soroban_pulse_notification_delivery_success_total[5m]))
              +
              sum(rate(soroban_pulse_notification_delivery_failure_total[5m]))
            )
          ) < 0.95
        for: 5m
        labels:
          severity: critical
          component: notifications
        annotations:
          summary: "Notification delivery success rate below 95%"
          description: "Only {{ $value | humanizePercentage }} of notification deliveries succeeded over the last 5 minutes (threshold: 95%). A notification channel may be down; follow the channel failover procedure."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/notifications.md#channel-failover"

      # #586: Replica sync monitoring alerts
      - alert: ReplicaLagHigh
        expr: soroban_pulse_replica_replay_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Replica replay lag exceeds 30s"
          description: "Replica {{ $labels.client_addr }} replay lag is {{ $value | humanizeDuration }}. Check replica I/O and network connectivity to the primary."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/replica-monitoring.md"

      - alert: ReplicaLagCritical
        expr: soroban_pulse_replica_replay_lag_seconds > 120
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Replica replay lag exceeds 2 minutes"
          description: "Replica {{ $labels.client_addr }} replay lag is {{ $value | humanizeDuration }}. Consider replica failover. Check pg_stat_replication on the primary."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/replica-monitoring.md"

      - alert: ReplicaLagBytes
        expr: soroban_pulse_replica_lag_bytes > 104857600
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Replica WAL lag exceeds 100 MiB"
          description: "Replica {{ $labels.client_addr }} is {{ $value | humanizeBytes }} behind the primary WAL position. Investigate replica throughput."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/replica-monitoring.md"

      - alert: ReplicaDown
        expr: soroban_pulse_replica_count == 0
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "No streaming replicas connected"
          description: "pg_stat_replication shows zero connected replicas. Read queries may be served from the primary only. Investigate replica health."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/replica-monitoring.md"

      # ── SLO error-budget alerts (Google SRE multi-window burn-rate guidance) ───────
      # The /v1/admin/slo/report endpoint exposes the same numbers as JSON.
      - alert: SLOBudgetBurnRateFast
        expr: soroban_pulse_slo_burn_rate > 14.4
        for: 2m
        labels:
          severity: critical
          component: slo
        annotations:
          summary: "SLO error budget is burning fast (>14.4x)"
          description: "SLO {{ $labels.slo }} has a burn rate of {{ $value }} over the last window. At this rate the 30-day error budget will be exhausted in ~2h. Page on-call immediately."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sli-slo.md"

      - alert: SLOBudgetBurnRateSlow
        expr: soroban_pulse_slo_burn_rate > 6
        for: 5m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "SLO error budget is burning too fast (>6x)"
          description: "SLO {{ $labels.slo }} has a burn rate of {{ $value }} over the last window. At this rate the 30-day error budget will be exhausted in ~5h. Investigate."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sli-slo.md"

      - alert: SLOErrorBudgetLow
        expr: soroban_pulse_slo_error_budget_remaining < 0.1
        for: 10m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "SLO error budget is nearly exhausted"
          description: "SLO {{ $labels.slo }} has only {{ $value | humanizePercentage }} of its error budget remaining. Freeze risky deploys until the budget recovers."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sli-slo.md"

      - alert: SLOCompletionBelowTarget
        expr: soroban_pulse_slo_completion_ratio < 0.95
        for: 15m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "SLO completion ratio below 95%"
          description: "SLO {{ $labels.slo }} completion ratio is {{ $value | humanizePercentage }} over the rolling window. Investigate before budget exhaustion."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sli-slo.md"

      - alert: SLOSeverelyBreached
        expr: soroban_pulse_slo_completion_ratio < 0.5
        for: 5m
        labels:
          severity: critical
          component: slo
        annotations:
          summary: "SLO completion ratio below 50%"
          description: "SLO {{ $labels.slo }} completion ratio is {{ $value | humanizePercentage }}. Treat as a customer-impacting incident."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sli-slo.md"

      # #587: Feature flag rollback automation alerts
      - alert: FeatureFlagAutoRollback
        expr: increase(soroban_pulse_feature_flag_rollback_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          component: feature_flags
        annotations:
          summary: "Feature flag was automatically rolled back"
          description: "A feature flag was automatically disabled due to an error rate spike. Check the feature_flag_audit table and recent HTTP error logs."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/feature-flag-rollback.md"

      - alert: HighErrorRateRollbackRisk
        expr: soroban_pulse_feature_flag_error_rate > 0.03
        for: 2m
        labels:
          severity: warning
          component: feature_flags
        annotations:
          summary: "Error rate approaching feature flag rollback threshold"
          description: "Current error rate is {{ $value | humanizePercentage }} (rollback threshold 5%). Feature flags with auto_rollback enabled may be disabled soon."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/feature-flag-rollback.md"

      # #1263: Incident correlation alerts
      - alert: IncidentsOpen
        expr: soroban_pulse_incidents_open > 0
        for: 5m
        labels:
          severity: warning
          component: incident_correlation
        annotations:
          summary: "Soroban Pulse has open correlated incidents"
          description: "{{ $value }} incident(s) remain open for more than 5 minutes. Correlated anomaly alerts, RPC errors, and indexer lag have been grouped into incidents. Review them via GET /v1/admin/incidents and investigate the underlying signals."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/incident-correlation.md"

      - alert: IncidentCreationSpike
        expr: increase(soroban_pulse_incidents_created_total[10m]) >= 3
        for: 0m
        labels:
          severity: critical
          component: incident_correlation
        annotations:
          summary: "Multiple correlated incidents created in a short window"
          description: "{{ $value }} incident(s) were created in the last 10 minutes, indicating a burst of correlated anomaly events (RPC errors, indexer lag, or anomaly alerts). Check GET /v1/admin/incidents and the indexer/RPC health dashboards."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/runbooks/incident-correlation.md"

      # SSE connection monitoring
      - alert: SSEConnectionErrorRateHigh
        expr: |
          (rate(soroban_pulse_sse_connections_total{result="error"}[5m]) /
           (rate(soroban_pulse_sse_connections_total[5m]) + 0.001)) > 0.05
        for: 5m
        labels:
          severity: warning
          component: sse
        annotations:
          summary: "SSE connection error rate is above 5%"
          description: "SSE error rate is {{ $value | humanizePercentage }} (threshold: 5%). More than 5% of SSE connections are encountering errors. Check client logs and inspect recent SSE connection attempts."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sse-reconnection.md"

      - alert: SSEConnectionErrorRateCritical
        expr: |
          (rate(soroban_pulse_sse_connections_total{result="error"}[5m]) /
           (rate(soroban_pulse_sse_connections_total[5m]) + 0.001)) > 0.10
        for: 2m
        labels:
          severity: critical
          component: sse
        annotations:
          summary: "SSE connection error rate is critical (>10%)"
          description: "SSE error rate is {{ $value | humanizePercentage }} (threshold: 10%). SSE service degradation detected. Investigate immediately."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/sse-reconnection.md"

      - alert: UnifiedErrorRateHigh
        expr: |
          (rate(soroban_pulse_errors_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "Unified error rate is above 10/sec"
          description: "Error rate across all subsystems (RPC, webhook, email, DB, SSE) is {{ $value | humanize }} errors/sec. Check which error kind is elevated: {{ $labels.kind }}"
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/troubleshooting.md"

      - alert: WebhookErrorRateHigh
        expr: |
          rate(soroban_pulse_errors_total{kind="webhook"}[5m]) > 1
        for: 10m
        labels:
          severity: warning
          component: webhooks
        annotations:
          summary: "Webhook error rate is above 1/sec"
          description: "Webhook errors: {{ $value | humanize }}/sec over 5 minutes. Check webhook delivery logs and network connectivity to webhook endpoints."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/webhook-logging.md"

      - alert: EmailErrorRateHigh
        expr: |
          rate(soroban_pulse_errors_total{kind="email"}[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          component: email
        annotations:
          summary: "Email delivery error rate is above 0.5/sec"
          description: "Email errors: {{ $value | humanize }}/sec over 5 minutes. Check SMTP relay connectivity and bounce logs."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/email-notifications.md"

      - alert: DatabaseErrorRateHigh
        expr: |
          rate(soroban_pulse_errors_total{kind="db"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database error rate is above 0.1/sec"
          description: "Database errors: {{ $value | humanize }}/sec over 5 minutes. Check PostgreSQL health: replication lag, connection pool saturation, and slow query logs."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/pool-optimization.md"

      - alert: PartitionPruningStalled
        expr: increase(soroban_pulse_partitions_dropped_total[24h]) == 0
        for: 0m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Partition pruning has not run in 24 hours"
          description: "No partitions have been dropped in the last 24 hours. Partition pruning may be stalled or disabled. Check: (1) DATA_RETENTION_DAYS is set, (2) pruner job is healthy, (3) drop_old_partitions function exists."
          runbook_url: "https://github.com/Soroban-Pulse/SorobanPulse/blob/main/docs/data-retention.md#partition-lifecycle-and-pruning"
