# cargo-deny configuration for SorobanPulse
# https://embarkstudios.github.io/cargo-deny/

# =====================================================================
# Handling false positives / temporary ignores
# =====================================================================
#
# If cargo-deny or the GitHub Dependency Review action flags a dependency
# that you have determined is safe in this context:
#
# 1. **cargo-deny advisory ignore** — add an entry to `[advisories].ignore`:
#
#      [[advisories.ignore]]
#      id = "RUSTSEC-0000-0000"
#      reason = "Vulnerability in feature X which we do not use; see <link>"
#
# 2. **cargo-deny licence ignore** — add the crate to the licence `exceptions`
#    list:
#
#      [[licenses.exceptions]]
#      allow = ["GPL-2.0"]
#      name = "some-crate"
#      version = "1.0"
#
# 3. **npm / pip / Go advisories** — for non-Rust ecosystems caught by the
#    `dependency-review-action` (.github/workflows/dependency-review.yml):
#
#    - npm: add a `"overrides"` entry in `package.json`, or pin the
#      transitive dep to a safe version.  Add a comment referencing the
#      advisory ID and the expected fix release.
#    - pip: pin the fixed version in `requirements.txt` and add a comment.
#    - Go: run `go get <module>@<safe-version>` to update `go.sum`, then
#      commit the change with a comment referencing the advisory.
#
#    If the advisory is a false positive for your use case, open an issue
#    on the upstream advisory database and document your reasoning in the
#    PR description.  Do NOT silently ignore an advisory without a comment.
#
# 4. **Temporary CI skip** — in exceptional cases (e.g. waiting for an
#    upstream patch), set the advisory ID in the `ignore` list above with
#    a comment including the advisory URL and a target removal date.
#    Removal is tracked by a follow-up issue linked in the comment.
#
# =====================================================================

# =====================================================================
# Advisories - Check for known security vulnerabilities
# =====================================================================
[advisories]
# Treat advisory database as the source of truth
version = 2
# Deny known vulnerabilities (CVEs / RUSTSEC advisories)
vulnerability = "deny"
# Deny unmaintained crates
unmaintained = "deny"
# Ignore advisories for specific crates (if any)
ignore = []
# Yanked crate versions are treated as vulnerabilities
yanked = "warn"
# Ignore individual advisories by RUSTSEC ID
# ignore = [
#     { id = "RUSTSEC-0000-0000", reason = "not applicable" }
# ]

# =====================================================================
# Bans - Check for banned dependencies
# =====================================================================
[bans]
# Multiple versions of the same crate are allowed (set to "deny" to enforce single version)
multiple-versions = "warn"
# List of crates that are not allowed to be used
deny = [
    # Security-sensitive crates that should not be used directly
    # { name = "openssl", wrappers = ["openssl-sys"] },
    # { name = "reqwest", wrappers = [] },
]

# List of crates that are allowed to have multiple versions
skip = [
    # Add crates here if they need to have multiple versions
    # { name = "some-crate", version = ">=1.0, <2.0" },
]

# List of crates that are allowed to be skipped from checking
allow-wildcard-dependencies = false

# Allow specific crates to have wildcard version requirements
# allow-wildcard-dependencies = [
#     { name = "some-crate", allow = ["*"] },
# ]

# =====================================================================
# Licenses - Check for allowed licenses
# =====================================================================
[licenses]
# How to handle unlicensed crates
unlicensed = "deny"
# List of allowed licenses
allow = [
    # Soroban Pulse itself is MIT-licensed (see LICENSE); keep MIT allowed.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Copyleft licenses that are incompatible with this project's MIT license.
# Any dependency introducing one of these will fail CI.
deny = [
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
# Allow crates with specific licenses
# allow = [
#     { name = "some-crate", license = "MIT" },
# ]
# Deny crates with specific licenses
# deny = [
#     { name = "some-crate", license = "GPL-3.0" },
# ]

# =====================================================================
# Sources - Check for crate sources
# =====================================================================
[sources]
# How to handle crates with unknown sources
unknown-registry = "warn"
unknown-git = "warn"
# List of allowed sources
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "https://github.com/rust-lang/crates.io",
]
allow-git = [
    # Add allowed git sources here
    # "https://github.com/some-org/some-repo",
]

# =====================================================================
# Targets - Check for specific targets
# =====================================================================
[targets]
# List of targets to check
# targets = [
#     { triple = "x86_64-unknown-linux-gnu", features = [] },
#     { triple = "aarch64-unknown-linux-gnu", features = [] },
# ]

# =====================================================================
# Yanked - Check for yanked crates
# =====================================================================
[yanked]
# How to handle yanked crate versions
warn = ["*"]

# =====================================================================
# All - Global settings
# =====================================================================
[all]
# Maximum number of advisories to report (0 = unlimited)
# max-advisories = 0
# Maximum number of bans to report (0 = unlimited)
# max-bans = 0

# =====================================================================
# Features - Feature configuration
# =====================================================================
[features]
# List of features to enable for all crates
# enable = ["some-feature"]
# List of features to disable for all crates
# disable = ["some-feature"]
