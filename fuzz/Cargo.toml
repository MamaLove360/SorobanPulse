[package]
name = "soroban-pulse-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-pulse = { path = "..", features = [] }
serde_json = "1"
# Must match the stellar-xdr API used by the library (`Limits`, serde JSON for
# `ScVal`); the old 0.0.18 pin without `serde` left fuzz_xdr_scval unbuildable.
stellar-xdr = { version = "22", features = ["curr", "serde"] }

# Prevent this from interfering with the workspace
[workspace]

[[bin]]
name = "fuzz_validate_contract_id"
path = "fuzz_targets/fuzz_validate_contract_id.rs"
test = false
doc = false

[[bin]]
name = "fuzz_validate_tx_hash"
path = "fuzz_targets/fuzz_validate_tx_hash.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pagination_params"
path = "fuzz_targets/fuzz_pagination_params.rs"
test = false
doc = false

# ── Issue #1154: new fuzz targets ──────────────────────────────────────────

[[bin]]
name = "fuzz_xdr_scval"
path = "fuzz_targets/fuzz_xdr_scval.rs"
test = false
doc = false

[[bin]]
name = "fuzz_normalizer"
path = "fuzz_targets/fuzz_normalizer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_contract_spec"
path = "fuzz_targets/fuzz_contract_spec.rs"
test = false
doc = false
