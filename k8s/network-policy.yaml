# NetworkPolicy for SorobanPulse
#
# Default-deny for both ingress and egress on all pods labeled
# `app: soroban-pulse`, with narrowly scoped allow rules:
#   - Ingress: only from the ALB ingress controller on TCP 3000
#   - Egress:  DNS (UDP/TCP 53), PostgreSQL (TCP 5432), Stellar RPC (TCP 443)
#
# All other ingress and egress traffic is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soroban-pulse
  namespace: soroban-pulse
  labels:
    app: soroban-pulse
spec:
  podSelector:
    matchLabels:
      app: soroban-pulse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only from the ALB ingress controller pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aws-load-balancer-controller
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL database.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    # Stellar RPC (HTTPS).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443